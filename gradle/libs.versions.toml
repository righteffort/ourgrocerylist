[versions]
agp = "9.1.0"  # https://developer.android.com/build/releases/gradle-plugin
kotlin = "2.3.20"  # https://kotlinlang.org/docs/releases.html
coreKtx = "1.18.0"  # https://developer.android.com/jetpack/androidx/releases/core
junit = "6.0.3"  # https://junit.org/
junit4 = "4.13.2"  # https://github.com/junit-team/junit4/releases
androidxJunit = "1.3.0"  # https://developer.android.com/jetpack/androidx/releases/test
espressoCore = "3.6.0"  # https://developer.android.com/jetpack/androidx/releases/test
appcompat = "1.7.1"  # https://developer.android.com/jetpack/androidx/releases/appcompat
composeBom = "2026.03.01"  # https://developer.android.com/develop/ui/compose/bom/bom-mapping
coroutines-test = "1.10.2"  # https://github.com/Kotlin/kotlinx.coroutines/releases
activity = "1.13.0"  # https://developer.android.com/jetpack/androidx/releases/activity
lifecycle = "2.10.0"  # https://developer.android.com/jetpack/androidx/releases/lifecycle
google-services = "4.4.4"  # https://developers.google.com/android/guides/google-services-plugin
firebase-bom = "34.11.0"  # https://firebase.google.com/support/release-notes/android
datastore = "1.2.1"  # https://developer.android.com/jetpack/androidx/releases/datastore
kotlinx-serialization = "1.10.0"  # https://github.com/Kotlin/kotlinx.serialization/releases
credentials = "1.5.0"  # https://developer.android.com/jetpack/androidx/releases/credentials
googleid = "1.2.0"  # https://developers.google.com/identity/android-credential-manager/releases
commons-csv = "1.14.1"  # https://commons.apache.org/csv/download_csv.cgi
robolectric = "4.16.1"    # https://github.com/robolectric/robolectric/releases/
turbine = "1.2.1"       # https://github.com/cashapp/turbine/releases

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
firebase-bom = { group = "com.google.firebase", name="firebase-bom", version.ref = "firebase-bom" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-functions = { group = "com.google.firebase", name = "firebase-functions" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines-test" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
commons-csv = { group = "org.apache.commons", name = "commons-csv", version.ref = "commons-csv" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[bundles]
junit-jupiter = ["junit-jupiter-api", "junit-jupiter-engine"]
integration-test = ["robolectric", "turbine" ]
