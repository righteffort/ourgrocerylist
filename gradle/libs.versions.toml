[versions]
agp = "9.1.0"  # https://developer.android.com/build/releases/gradle-plugin
kotlin = "2.3.20"  # https://kotlinlang.org/docs/releases.html
coreKtx = "1.18.0"  # https://developer.android.com/jetpack/androidx/releases/core
junit = "6.0.3"  # https://junit.org/
androidxJunit = "1.3.0"  # https://developer.android.com/jetpack/androidx/releases/test
espressoCore = "3.6.0"  # https://developer.android.com/jetpack/androidx/releases/test
appcompat = "1.7.1"  # https://developer.android.com/jetpack/androidx/releases/appcompat
composeBom = "2026.03.01"  # https://developer.android.com/develop/ui/compose/bom/bom-mapping
activity = "1.13.0"  # https://developer.android.com/jetpack/androidx/releases/activity
lifecycle = "2.10.0"  # https://developer.android.com/jetpack/androidx/releases/lifecycle

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

